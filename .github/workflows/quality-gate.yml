name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Python 3.12 tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,validation]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run observer-time validation benchmark
        env:
          PYTHONTZPATH: ""
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.observer_time \
            --manifest validation/manifests/observer_time_v1.json \
            --output "$RUNNER_TEMP/observer_time_reference_run.json"

      - name: Upload observer-time validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-time-validation-record
          path: ${{ runner.temp }}/observer_time_reference_run.json
          if-no-files-found: error

      - name: Run strict civil-time validation benchmark
        env:
          PYTHONTZPATH: ""
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.civil_time \
            --manifest validation/manifests/civil_time_v2.json \
            --output "$RUNNER_TEMP/civil_time_reference_run.json"

      - name: Upload civil-time validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civil-time-validation-record
          path: ${{ runner.temp }}/civil_time_reference_run.json
          if-no-files-found: error

      - name: Run schedule-interval validation benchmark
        env:
          PYTHONTZPATH: ""
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.schedule_interval \
            --manifest validation/manifests/schedule_interval_v1.json \
            --output "$RUNNER_TEMP/schedule_interval_reference_run.json"

      - name: Upload schedule-interval validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-interval-validation-record
          path: ${{ runner.temp }}/schedule_interval_reference_run.json
          if-no-files-found: error

      - name: Run celestial-coordinate validation benchmark
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.celestial_coordinates \
            --output "$RUNNER_TEMP/celestial_coordinates_reference_run.json"

      - name: Upload celestial-coordinate validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celestial-coordinate-validation-record
          path: ${{ runner.temp }}/celestial_coordinates_reference_run.json
          if-no-files-found: error

      - name: Run solar-lunar-twilight validation benchmark
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.solar_lunar_twilight \
            --output "$RUNNER_TEMP/solar_lunar_twilight_reference_run.json"

      - name: Upload solar-lunar-twilight validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-lunar-twilight-validation-record
          path: ${{ runner.temp }}/solar_lunar_twilight_reference_run.json
          if-no-files-found: error

      - name: Run transit-ephemeris validation benchmark
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.transit_ephemeris \
            --output "$RUNNER_TEMP/transit_ephemeris_reference_run.json"

      - name: Upload transit-ephemeris validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-ephemeris-validation-record
          path: ${{ runner.temp }}/transit_ephemeris_reference_run.json
          if-no-files-found: error

      - name: Run observer-arrival research validation benchmark
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.observer_arrival \
            --output "$RUNNER_TEMP/observer_arrival_reference_run.json"

      - name: Upload observer-arrival research validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-arrival-validation-record
          path: ${{ runner.temp }}/observer_arrival_reference_run.json
          if-no-files-found: error

      - name: Audit observer-arrival error-budget contract
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.arrival_budget \
            --output "$RUNNER_TEMP/arrival_budget_reference_run.json"

      - name: Upload observer-arrival error-budget audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-budget-audit-record
          path: ${{ runner.temp }}/arrival_budget_reference_run.json
          if-no-files-found: error

      - name: Qualify source convention and solar component reference
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.source_reference \
            --output "$RUNNER_TEMP/source_reference_reference_run.json"

      - name: Upload source-reference qualification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reference-qualification-record
          path: ${{ runner.temp }}/source_reference_reference_run.json
          if-no-files-found: error

      - name: Audit matched-convention clock-reference qualification
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.clock_reference \
            --output "$RUNNER_TEMP/clock_reference_reference_run.json"

      - name: Upload clock-reference qualification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-reference-qualification-record
          path: ${{ runner.temp }}/clock_reference_reference_run.json
          if-no-files-found: error

      - name: Audit integrated time-ephemeris clock mapping
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.time_ephemeris \
            --output "$RUNNER_TEMP/time_ephemeris_reference_run.json"

      - name: Upload time-ephemeris clock-mapping audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-ephemeris-clock-mapping-record
          path: ${{ runner.temp }}/time_ephemeris_reference_run.json
          if-no-files-found: error

      - name: Audit independent site-clock mapping and uncertainty
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.site_clock \
            --output "$RUNNER_TEMP/site_clock_reference_run.json"

      - name: Upload site-clock qualification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-clock-qualification-record
          path: ${{ runner.temp }}/site_clock_reference_run.json
          if-no-files-found: error

      - name: Audit relativistic site-frame mapping and inverse bounds
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.site_frame \
            --output "$RUNNER_TEMP/site_frame_reference_run.json"

      - name: Upload site-frame mapping audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-frame-mapping-record
          path: ${{ runner.temp }}/site_frame_reference_run.json
          if-no-files-found: error

      - name: Audit coupled relativistic site-clock mapping
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.coupled_clock \
            --output "$RUNNER_TEMP/coupled_clock_reference_run.json"

      - name: Upload coupled site-clock audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-site-clock-record
          path: ${{ runner.temp }}/coupled_clock_reference_run.json
          if-no-files-found: error

      - name: Run time-normalization evidence audit
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.time_normalization \
            --output "$RUNNER_TEMP/time_normalization_reference_run.json"

      - name: Upload time-normalization evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-normalization-evidence-record
          path: ${{ runner.temp }}/time_normalization_reference_run.json
          if-no-files-found: error

      - name: Audit independent time-ephemeris cross-model qualification
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.cross_model_time \
            --output "$RUNNER_TEMP/cross_model_time_reference_run.json"

      - name: Upload cross-model time-ephemeris record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-model-time-ephemeris-record
          path: ${{ runner.temp }}/cross_model_time_reference_run.json
          if-no-files-found: error

      - name: Audit geocentric clock sensitivity and uncertainty propagation
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.clock_sensitivity \
            --output "$RUNNER_TEMP/clock_sensitivity_reference_run.json"

      - name: Upload clock-sensitivity uncertainty record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-sensitivity-uncertainty-record
          path: ${{ runner.temp }}/clock_sensitivity_reference_run.json
          if-no-files-found: error

      - name: Audit ephemeris covariance provenance and applicability
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.ephemeris_covariance \
            --output "$RUNNER_TEMP/ephemeris_covariance_reference_run.json"

      - name: Upload ephemeris covariance qualification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeris-covariance-qualification-record
          path: ${{ runner.temp }}/ephemeris_covariance_reference_run.json
          if-no-files-found: error

      - name: Audit integrated clock parameter response
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.integrated_clock_response \
            --output "$RUNNER_TEMP/integrated_clock_response_reference_run.json"

      - name: Upload integrated clock parameter-response record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-clock-parameter-response-record
          path: ${{ runner.temp }}/integrated_clock_response_reference_run.json
          if-no-files-found: error

      - name: Audit telescope and imaging geometry
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.telescope_imaging \
            --output "$RUNNER_TEMP/telescope_imaging_reference_run.json"

      - name: Upload telescope and imaging validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telescope-imaging-validation-record
          path: ${{ runner.temp }}/telescope_imaging_reference_run.json
          if-no-files-found: error

      - name: Audit planetary positions
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.planetary_positions \
            --output "$RUNNER_TEMP/planetary_positions_reference_run.json"

      - name: Upload planetary position validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-position-validation-record
          path: ${{ runner.temp }}/planetary_positions_reference_run.json
          if-no-files-found: error

      - name: Audit visibility and transit-window sampling
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.visibility_sampling \
            --output "$RUNNER_TEMP/visibility_sampling_reference_run.json"

      - name: Upload visibility and transit-window sampling record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visibility-sampling-validation-record
          path: ${{ runner.temp }}/visibility_sampling_reference_run.json
          if-no-files-found: error

      - name: Audit planner weather ranking and schedule heuristics
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          python -m validation.heuristic_characterisation \
            --output "$RUNNER_TEMP/heuristic_characterisation_reference_run.json"

      - name: Upload heuristic characterisation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heuristic-characterisation-validation-record
          path: ${{ runner.temp }}/heuristic_characterisation_reference_run.json
          if-no-files-found: error

      - name: Reproduce light-curve baseline including known scientific failures
        if: ${{ !cancelled() }}
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: |
          audit_status=0
          python -m validation.light_curve_campaign --audit-observed-baseline \
            --output "$RUNNER_TEMP/light_curve_campaign_reference_run.json" || audit_status=$?
          python -m validation.light_curve_bls_diagnostic \
            --record "$RUNNER_TEMP/light_curve_campaign_reference_run.json" \
            --output "$RUNNER_TEMP/light_curve_bls_diagnostic.json"
          exit "$audit_status"

      - name: Upload light-curve baseline and retained discrepancies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-curve-validation-record
          path: |
            ${{ runner.temp }}/light_curve_campaign_reference_run.json
            ${{ runner.temp }}/light_curve_bls_diagnostic.json
          if-no-files-found: error
