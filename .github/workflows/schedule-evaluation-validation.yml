name: Schedule Reserved Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: schedule-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-audit:
    name: Frozen scheduler evaluation replay
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev,validation]"
      - name: Replay complete frozen scheduler evaluation
        timeout-minutes: 10
        env:
          ASTROSCOPE_IMPLEMENTATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ASTROSCOPE_CHECKOUT_COMMIT: ${{ github.sha }}
        run: >-
          python -m validation.schedule_evaluation_audit
          --access-label exposed_regression_replay
          --output "$RUNNER_TEMP/schedule_evaluation_reference_run.json"
      - name: Upload evaluation record and access journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-evaluation-validation-record
          path: |
            ${{ runner.temp }}/schedule_evaluation_reference_run.json
            ${{ runner.temp }}/schedule_evaluation_reference_run.access.jsonl
          if-no-files-found: error
