[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroscope-ai-observatory"
version = "0.2.0"
description = "An intelligent multilingual observatory planner and interactive planetarium."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sirichet Sriamontham" }
]
dependencies = [
    "astropy>=8.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "streamlit>=1.45",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]
validation = [
    "tzdata==2026.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
